name: Algebra and conditional wave checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest sympy
      - run: python -m pytest -q
      - run: python scripts/verify_wave_bridge.py --check
      - run: python scripts/verify_segment_channel.py --check
