name: Algebra and conditional wave checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          build: "true"
          use-mathlib-cache: "true"
          axiom-audit: "true"
          axiom-audit-root: HyperspaceWaves
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest sympy
      - run: python -m pytest -q
      - run: python scripts/verify_wave_bridge.py --check
      - run: python scripts/verify_segment_channel.py --check
      - run: python scripts/verify_source_matching.py --check
      - run: python scripts/verify_compact_echo.py
      - run: python scripts/verify_compact_echo_feedback.py
      - run: python scripts/verify_composite_response.py --check
      - run: python scripts/verify_occupation_channel.py --check
      - run: python scripts/verify_compact_locality.py --check
